server {
    listen 80;
    server_name app.domingoasdez.com;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 100M;

    # Serve ACME challenge files from the correct base webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
       return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name app.domingoasdez.com;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    client_max_body_size 100M;

    # Serve ACME challenge files from the correct base webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_redirect off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    }

    # Logging
    access_log /var/log/nginx/app.domingoasdez.com/access.log;
    error_log /var/log/nginx/app.domingoasdez.com/error.log;

    ssl_certificate /etc/letsencrypt/live/app.domingoasdez.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.domingoasdez.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256";
}
