<!doctype html>
<html lang="%lang%" class="%theme-class%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<!--
			iOS Safari paints its status bar and toolbar from these at parse time. A single
			light theme-color is locked in before JS runs, which leaves white bars in dark mode.
			Keep the hexes in sync with THEME_COLORS in src/lib/theme.ts.
		-->
		<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#08090b" media="(prefers-color-scheme: dark)" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<style>
			html {
				background-color: #f2f4f7;
				color-scheme: light;
			}
			html.dark {
				background-color: #08090b;
				color-scheme: dark;
			}
		</style>
		<script>
			(function () {
				var saved = document.cookie.match(/(?:^|; )theme=(light|dark)/);
				var dark = saved
					? saved[1] === 'dark'
					: window.matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				var color = dark ? '#08090b' : '#f2f4f7';
				var metas = document.querySelectorAll('meta[name="theme-color"]');
				if (saved) {
					for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
				}
			})();
		</script>
		<!--
			Google Analytics + AdSense. Placeholders are filled by hooks.server.ts from public env.
			Empty IDs or a non-production hostname skip every Google script (including localhost).
		-->
		<script>
			(function () {
				var hosts = {
					'domingoasdez.com': 1,
					'www.domingoasdez.com': 1,
					'app.domingoasdez.com': 1
				};
				if (!hosts[location.hostname]) return;

				var gaId = '%PUBLIC_GA_MEASUREMENT_ID%';
				var adsClient = '%PUBLIC_ADSENSE_CLIENT%';
				if (!gaId && !adsClient) return;

				window.gtag_enable_tcf_support = true;
				window.dataLayer = window.dataLayer || [];
				function gtag() {
					window.dataLayer.push(arguments);
				}
				window.gtag = gtag;

				// Denied until Funding Choices / TCF updates consent. Do not copy the legacy
				// site's default-granted configuration.
				gtag('consent', 'default', {
					ad_storage: 'denied',
					ad_user_data: 'denied',
					ad_personalization: 'denied',
					analytics_storage: 'denied'
				});

				if (adsClient) {
					var fc = document.createElement('script');
					fc.async = true;
					fc.src =
						'https://fundingchoicesmessages.google.com/i/' +
						encodeURIComponent(adsClient) +
						'?ers=2';
					document.head.appendChild(fc);
				}

				if (gaId) {
					var gs = document.createElement('script');
					gs.async = true;
					gs.src =
						'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(gaId);
					document.head.appendChild(gs);
					gtag('js', new Date());
					gtag('config', gaId, {
						send_page_view: false,
						cookie_domain: 'auto'
					});
				}

				if (adsClient) {
					var as = document.createElement('script');
					as.async = true;
					as.crossOrigin = 'anonymous';
					as.src =
						'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=' +
						encodeURIComponent(adsClient);
					document.head.appendChild(as);
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
